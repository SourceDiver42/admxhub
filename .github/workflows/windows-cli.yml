name: Windows CLI

# Builds a standalone admxhub.exe (no Python needed) and smoke-tests every extraction path on Windows.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "scripts/**", "pyproject.toml", ".github/workflows/windows-cli.yml"]
  pull_request:
    paths: ["src/**", "scripts/**", "pyproject.toml", ".github/workflows/windows-cli.yml"]
  workflow_dispatch:

permissions:
  contents: write   # attach the exe to releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = python -c "import admxhub; print(admxhub.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $v" }

      - name: Build admxhub.exe
        run: pyinstaller --onefile --name admxhub --collect-data admxhub --noconfirm scripts/admxhub_entry.py

      - name: Smoke tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $exe = ".\dist\admxhub.exe"
          $out = Join-Path $env:RUNNER_TEMP "admx"
          $store = Join-Path $env:RUNNER_TEMP "PolicyDefinitions"
          $failed = @()
          # Every step runs; failures become annotations (visible in the run summary and the checks API).
          function Step([string]$name, [string[]]$cmdArgs, [int[]]$ok = @(0)) {
            Write-Host "::group::$name"
            $o = & $exe @cmdArgs 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $o
            Write-Host "::endgroup::"
            if ($ok -notcontains $code) {
              $msg = ($o -replace "`r?`n", " | ").Trim()
              if ($msg.Length -gt 900) { $msg = $msg.Substring($msg.Length - 900) }
              Write-Host "::error title=smoke test '$name' failed (exit $code)::$msg"
              $script:failed += $name
            }
          }
          Step "version" @("--version")
          Step "validate" @("validate")
          Step "check" @("check", "--live") @(0, 2)   # 2 = a vendor did not answer: reported, not fatal
          Step "zip (firefox)" @("download", "firefox", "--out", $out, "--lang", "en-US")
          Step "cab with nested zip (edge)" @("download", "edge", "--out", $out, "--lang", "en-US")
          Step "self-extracting exe (office)" @("download", "office", "--out", $out)
          Step "msi (windows11)" @("download", "windows11", "--out", $out, "--lang", "en-US")
          Step "install" @("install", "firefox", "chrome", "--store", $store, "--yes")
          Step "status" @("status", "--store", $store)
          $n = (Get-ChildItem -Recurse $out -Filter *.admx -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "admx files extracted: $n"
          if ($failed.Count) { throw "failed: $($failed -join ', ')" }

      - name: Checksum
        run: (Get-FileHash dist\admxhub.exe -Algorithm SHA256).Hash.ToLower() + "  admxhub.exe" | Out-File -Encoding ascii dist\admxhub.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: admxhub-windows-x64
          path: |
            dist/admxhub.exe
            dist/admxhub.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/admxhub.exe dist/admxhub.exe.sha256 --title "admxhub ${{ github.ref_name }}" --generate-notes
