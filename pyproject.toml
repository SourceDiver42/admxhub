[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "admxhub"
dynamic = ["version"]
description = "Find, download and install Group Policy ADMX templates; builds the ADMX Hub catalog."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx2==2.14.0",
    "jmespath==1.1.0",
    "olefile==0.47",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.scripts]
admxhub = "admxhub.cli:main"

[tool.setuptools.dynamic]
version = { attr = "admxhub.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admxhub = ["sources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (vendor download sites)"]
addopts = "-m 'not network'"
